services:
  # CPU-only, STT alone, no GPU needed. Cheaper if you don't want TTS at all.
  stt:
    build: .
    env_file: .env
    environment:
      MODEL_PATH: /data/models/whisper-small-uz-v1
      HF_HOME: /data/huggingface
      PORT: 8090
    ports:
      - "8090:8090"
    volumes:
      - ./models:/data/models
      - ./huggingface-cache:/data/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  # STT + Navoiy TTS together, serving the whole playground from one origin.
  # Requires an NVIDIA GPU and the NVIDIA Container Toolkit on the host. Build
  # is slow and the image is large (CosyVoice + a ~0.5B parameter base model
  # are downloaded during the build). See README's Text-to-speech section.
  voice:
    build:
      context: .
      dockerfile: Dockerfile.voice
    env_file: .env
    environment:
      TTS_ENABLED: "true"
      PORT: 8091
    ports:
      - "8091:8091"
    volumes:
      - ./models:/data/models
      - ./huggingface-cache:/data/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
